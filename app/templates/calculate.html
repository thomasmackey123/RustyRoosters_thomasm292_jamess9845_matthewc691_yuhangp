{% extends "base.html" %}

{% block title %}Calculate - RR Fitness Genie{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem; color: var(--text-muted);">
  <h2>Calcualte calorie page</h2>
  <h3>hi {{username}}!</h3>
  <p>work in progress or sum</p>
  <div id="food-container">

  </div>
  <div class="selected-foods">
    {% if foods %}
      {% for food in foods %}
        <div class="food-card">
          <p id="food-name">{{ food.name }}</p>
          <form action="/add_food" method="get">
            <button type="submit" name="add_food">Add</button>
          </form>
        </div>
      {% endfor %}
    {% endif %}
  </div>
  <div class="select-food">
    <form method="get" action="/calculate">
      <input type="text" name="searchbar" placeholder="Search for tierlist..."
        value="{{ request.args.get('searchbar', '') }}"">
      <button type="submit">Search</button>
    </form>
  </div>
</div>
{% endblock %}
